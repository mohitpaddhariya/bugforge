<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Supportdesk{% endblock %} — ShopForge Supportdesk</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/" data-testid="brand-home">
        <span class="brand-mark">SF</span>
        <span class="brand-text">ShopForge <b>Supportdesk</b></span>
      </a>
      <nav class="topnav">
        <a href="/" data-testid="nav-queue">Queue</a>
        <a href="/api/tickets" data-testid="nav-json">JSON</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      internal tool · tickets are static · no connection to store db
    </div>
  </footer>
</body>
</html>
